<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AI Personas" />
  <meta id="meta-theme-color" name="theme-color" content="#F2F2F7" />
  <title>AI Personas Studio</title>

  <!-- Tailwind CSS via CDN with Dark Mode configured for class toggling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            ios: {
              blue: '#007AFF',
              green: '#34C759',
              red: '#FF3B30',
              gray: '#8E8E93',
              lightBg: '#F2F2F7',
              lightCard: '#FFFFFF',
              lightBubble: '#E9E9EB',
              darkBg: '#000000',
              darkCard: '#1C1C1E',
              darkBubble: '#2C2C2E',
              darkBorder: '#38383A',
              lightBorder: '#E5E5EA'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Helvetica Neue', 'sans-serif']
          }
        }
      }
    };
  </script>

  <!-- Embedded Web App Manifest -->
  <link rel="manifest" id="manifest-placeholder" />

  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }
    body {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .safe-top { padding-top: max(14px, var(--sat)); }
    .safe-bottom { padding-bottom: max(14px, var(--sab)); }

    /* Typing bubble pulse animation */
    @keyframes dotPulse {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }
    .dot-1 { animation: dotPulse 1.4s infinite ease-in-out; }
    .dot-2 { animation: dotPulse 1.4s infinite ease-in-out 0.2s; }
    .dot-3 { animation: dotPulse 1.4s infinite ease-in-out 0.4s; }

    pre code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
  </style>
</head>
<body class="h-full bg-ios-lightBg dark:bg-ios-darkBg text-neutral-900 dark:text-neutral-100 font-sans antialiased overflow-hidden transition-colors duration-200">

  <!-- ==================== MAIN APP WRAPPER ==================== -->
  <div id="app" class="h-dvh flex flex-col w-full max-w-lg mx-auto relative overflow-hidden bg-ios-lightBg dark:bg-ios-darkBg sm:border-x sm:border-ios-lightBorder sm:dark:border-ios-darkBorder">
    
    <!-- ==================== VIEW 1: CHARACTER DIRECTORY ==================== -->
    <section id="view-bots" class="flex-1 flex flex-col h-full w-full overflow-hidden">
      <!-- Top Navigation Header -->
      <header class="safe-top px-4 pb-3 flex items-center justify-between border-b border-ios-lightBorder dark:border-ios-darkBorder bg-ios-lightBg/90 dark:bg-ios-darkBg/90 backdrop-blur-xl z-10 sticky top-0">
        <div>
          <span class="text-xs font-bold uppercase tracking-wider text-ios-blue">AI Studio</span>
          <h1 class="text-2xl font-black tracking-tight">Characters</h1>
        </div>
        
        <div class="flex items-center gap-2">
          <!-- Quick Dark / Light Mode Toggle Button -->
          <button id="btn-toggle-theme" aria-label="Toggle Theme" class="p-2.5 rounded-full bg-neutral-200 dark:bg-neutral-800 text-neutral-800 dark:text-neutral-200 active:scale-90 transition-transform cursor-pointer">
            <span id="theme-icon-sun" class="hidden text-base">☀️</span>
            <span id="theme-icon-moon" class="text-base">🌙</span>
          </button>

          <!-- Settings Button -->
          <button id="btn-open-settings" aria-label="Settings" class="p-2.5 rounded-full bg-neutral-200 dark:bg-neutral-800 text-neutral-800 dark:text-neutral-200 active:scale-90 transition-transform cursor-pointer">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
          </button>

          <!-- + New Character Button -->
          <button id="btn-create-bot" class="flex items-center gap-1.5 px-4 py-2 rounded-full bg-ios-blue text-white text-sm font-bold active:scale-90 transition-transform shadow-sm cursor-pointer">
            <svg class="w-4 h-4 stroke-[3]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
            </svg>
            <span>New</span>
          </button>
        </div>
      </header>

      <!-- Search Input -->
      <div class="px-4 py-2.5">
        <div class="relative flex items-center">
          <svg class="w-4 h-4 absolute left-3.5 text-ios-gray" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          <input type="text" id="input-search-bots" placeholder="Search characters..." class="w-full bg-neutral-200/80 dark:bg-neutral-800/80 text-sm placeholder-ios-gray rounded-xl pl-9 pr-4 py-2 focus:outline-none focus:ring-2 focus:ring-ios-blue transition-all" />
        </div>
      </div>

      <!-- Character List Container -->
      <main id="bot-list-container" class="flex-1 overflow-y-auto px-4 py-2 space-y-3 pb-24">
        <!-- Injected dynamically by JavaScript -->
      </main>
    </section>

    <!-- ==================== VIEW 2: CHAT CONVERSATION ==================== -->
    <section id="view-chat" class="hidden flex-1 flex flex-col h-full w-full overflow-hidden bg-white dark:bg-neutral-950">
      <!-- Chat Navbar Header -->
      <header class="safe-top px-3 pb-2.5 flex items-center justify-between border-b border-ios-lightBorder dark:border-ios-darkBorder bg-ios-lightBg/95 dark:bg-ios-darkBg/95 backdrop-blur-xl z-20">
        <button id="btn-chat-back" class="flex items-center text-ios-blue font-semibold active:opacity-50 transition-opacity pr-2 py-1 cursor-pointer">
          <svg class="w-6 h-6 -ml-1 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
          </svg>
          <span class="text-sm">Back</span>
        </button>

        <!-- Bot Identity Info -->
        <div class="flex items-center gap-2.5 max-w-[55%] truncate cursor-pointer" id="btn-chat-header-info">
          <div id="chat-header-avatar" class="w-8 h-8 rounded-full overflow-hidden bg-neutral-200 dark:bg-neutral-800 flex-shrink-0 flex items-center justify-center font-bold text-xs text-white"></div>
          <div class="truncate text-left">
            <h2 id="chat-header-name" class="text-sm font-bold truncate leading-tight">Bot Name</h2>
            <p id="chat-header-model" class="text-[10px] text-ios-gray truncate font-mono">gpt-4o-mini</p>
          </div>
        </div>

        <!-- Chat Options Menu Button -->
        <div class="relative">
          <button id="btn-chat-options" class="p-2 text-ios-blue active:opacity-50 cursor-pointer">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"/>
            </svg>
          </button>
          
          <!-- Dropdown Menu -->
          <div id="chat-dropdown-menu" class="hidden absolute right-0 mt-1 w-48 rounded-2xl bg-white/95 dark:bg-neutral-900/95 backdrop-blur-xl shadow-2xl border border-neutral-200 dark:border-neutral-800 py-1.5 z-50 text-sm">
            <button id="menu-edit-bot" class="w-full text-left px-4 py-2.5 hover:bg-neutral-100 dark:hover:bg-neutral-800 flex items-center gap-2">
              <span>✏️ Edit Persona</span>
            </button>
            <button id="menu-clear-chat" class="w-full text-left px-4 py-2.5 hover:bg-neutral-100 dark:hover:bg-neutral-800 text-ios-red flex items-center gap-2 border-t border-neutral-100 dark:border-neutral-800">
              <span>🗑️ Clear History</span>
            </button>
          </div>
        </div>
      </header>

      <!-- Messages Stream Area -->
      <main id="chat-messages-container" class="flex-1 overflow-y-auto px-4 py-4 space-y-4 select-text">
        <!-- Messages rendered dynamically -->
      </main>

      <!-- Animated Typing Dots -->
      <div id="typing-indicator" class="hidden px-4 py-2 flex items-center gap-2 text-xs text-ios-gray">
        <div class="px-3.5 py-2.5 rounded-2xl bg-ios-lightBubble dark:bg-ios-darkBubble inline-flex items-center gap-1.5 shadow-sm">
          <span class="w-2 h-2 rounded-full bg-ios-gray dot-1"></span>
          <span class="w-2 h-2 rounded-full bg-ios-gray dot-2"></span>
          <span class="w-2 h-2 rounded-full bg-ios-gray dot-3"></span>
        </div>
      </div>

      <!-- Bottom Chat Composer -->
      <footer class="safe-bottom p-2.5 bg-ios-lightBg/95 dark:bg-ios-darkBg/95 backdrop-blur-xl border-t border-ios-lightBorder dark:border-ios-darkBorder z-20">
        <form id="chat-form" class="flex items-end gap-2 max-w-full">
          <div class="flex-1 bg-white dark:bg-neutral-900 border border-ios-lightBorder dark:border-ios-darkBorder rounded-2xl flex items-center px-3.5 py-2 focus-within:ring-2 focus-within:ring-ios-blue transition-all">
            <textarea id="chat-textarea" rows="1" placeholder="Type a message..." class="w-full bg-transparent text-sm resize-none focus:outline-none max-h-32 leading-5 text-neutral-900 dark:text-neutral-100 placeholder-ios-gray"></textarea>
          </div>
          <button type="submit" id="btn-send-message" disabled class="p-2.5 rounded-full bg-ios-blue text-white disabled:opacity-40 disabled:pointer-events-none active:scale-95 transition-all flex-shrink-0 cursor-pointer shadow-md">
            <svg class="w-5 h-5 translate-x-0.5 -translate-y-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </button>
        </form>
      </footer>
    </section>

    <!-- ==================== MODAL: BOT CREATOR & EDITOR ==================== -->
    <div id="modal-bot-editor" class="hidden fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/60 backdrop-blur-sm">
      <div class="w-full max-w-lg bg-ios-lightBg dark:bg-neutral-900 rounded-t-3xl sm:rounded-3xl max-h-[92vh] flex flex-col overflow-hidden shadow-2xl border border-neutral-200/50 dark:border-neutral-800">
        
        <!-- Modal Top Bar -->
        <div class="px-4 py-3.5 border-b border-ios-lightBorder dark:border-ios-darkBorder flex items-center justify-between bg-white dark:bg-neutral-900 sticky top-0 z-10">
          <button type="button" id="btn-cancel-bot-edit" class="text-sm font-semibold text-ios-blue cursor-pointer py-1 px-2">Cancel</button>
          <h3 id="modal-bot-title" class="text-base font-bold">New Character</h3>
          <button type="button" id="btn-save-bot" class="text-sm font-bold text-ios-blue cursor-pointer py-1 px-2">Save</button>
        </div>

        <!-- Form Scroll Area -->
        <div class="flex-1 overflow-y-auto p-4 space-y-4">
          <!-- Avatar Uploader -->
          <div class="flex flex-col items-center justify-center py-2">
            <input type="file" id="bot-avatar-file-input" accept="image/*" class="hidden" />
            <div class="relative group cursor-pointer" id="avatar-picker-trigger">
              <div id="bot-avatar-preview" class="w-20 h-20 rounded-full bg-gradient-to-tr from-ios-blue to-purple-600 text-white flex items-center justify-center font-bold text-2xl shadow-md overflow-hidden ring-4 ring-white dark:ring-neutral-800">
                <span>🤖</span>
              </div>
              <div class="absolute bottom-0 right-0 bg-neutral-900 text-white rounded-full p-1.5 shadow-md">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
              </div>
            </div>
            <button type="button" id="btn-choose-photo" class="text-xs text-ios-blue font-bold mt-2 cursor-pointer">Choose Photo from Library</button>
          </div>

          <!-- Name & Tagline Inputs -->
          <div class="bg-white dark:bg-neutral-800 rounded-2xl overflow-hidden border border-neutral-200 dark:border-neutral-700 divide-y divide-neutral-100 dark:divide-neutral-700">
            <div class="p-3">
              <label class="block text-[11px] font-bold text-ios-gray uppercase tracking-wider mb-1">Character Name</label>
              <input type="text" id="bot-name-input" placeholder="e.g. Socrates, Cyber Samurai, Luna" class="w-full bg-transparent text-sm focus:outline-none text-neutral-900 dark:text-neutral-100" />
            </div>
            <div class="p-3">
              <label class="block text-[11px] font-bold text-ios-gray uppercase tracking-wider mb-1">Tagline / Role</label>
              <input type="text" id="bot-tagline-input" placeholder="e.g. Philosophical Guide &amp; Teacher" class="w-full bg-transparent text-sm focus:outline-none text-neutral-900 dark:text-neutral-100" />
            </div>
          </div>

          <!-- System Prompt -->
          <div class="bg-white dark:bg-neutral-800 rounded-2xl p-3 border border-neutral-200 dark:border-neutral-700">
            <label class="block text-[11px] font-bold text-ios-gray uppercase tracking-wider mb-1">System Instructions (Personality)</label>
            <textarea id="bot-prompt-input" rows="4" placeholder="Describe how this character speaks, their knowledge, and their mannerisms..." class="w-full bg-transparent text-sm resize-none focus:outline-none text-neutral-900 dark:text-neutral-100 placeholder-ios-gray"></textarea>
          </div>

          <!-- Quick Starter Archetypes -->
          <div class="space-y-1.5">
            <span class="text-[11px] font-bold text-ios-gray uppercase tracking-wider ml-1">Quick Archetypes</span>
            <div class="flex gap-2 flex-wrap">
              <button type="button" class="btn-quick-archetype text-xs px-3 py-1.5 rounded-full bg-neutral-200 dark:bg-neutral-800 font-medium active:scale-95" data-name="Marcus Aurelius" data-tagline="Stoic Emperor &amp; Sage" data-prompt="You are Marcus Aurelius, Roman Emperor and Stoic author of Meditations. Offer stoic wisdom and tranquil perspective." data-temp="0.6">🏛️ Stoic Sage</button>
              <button type="button" class="btn-quick-archetype text-xs px-3 py-1.5 rounded-full bg-neutral-200 dark:bg-neutral-800 font-medium active:scale-95" data-name="Nova Code" data-tagline="Senior Software Architect" data-prompt="You are Nova, an elite senior software architect. Provide clean, efficient code and crisp technical explanations." data-temp="0.3">💻 Tech Mentor</button>
              <button type="button" class="btn-quick-archetype text-xs px-3 py-1.5 rounded-full bg-neutral-200 dark:bg-neutral-800 font-medium active:scale-95" data-name="Lyra" data-tagline="Creative Sci-Fi Novelist" data-prompt="You are Lyra, a world-building sci-fi novelist. Write vivid, imaginative, and evocative stories." data-temp="1.2">✨ Novelist</button>
            </div>
          </div>

          <!-- Model & Parameters -->
          <div class="bg-white dark:bg-neutral-800 rounded-2xl p-3 border border-neutral-200 dark:border-neutral-700 space-y-3">
            <div>
              <label class="block text-[11px] font-bold text-ios-gray uppercase tracking-wider mb-1">OpenAI Model</label>
              <select id="bot-model-select" class="w-full bg-neutral-100 dark:bg-neutral-700 text-sm rounded-xl px-3 py-2 focus:outline-none">
                <option value="gpt-4o-mini">GPT-4o Mini (Fast &amp; Accurate)</option>
                <option value="gpt-4o">GPT-4o (Most Intelligent)</option>
                <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
              </select>
            </div>

            <!-- Temperature Slider -->
            <div>
              <div class="flex justify-between items-center text-xs mb-1">
                <span class="text-[11px] font-bold text-ios-gray uppercase tracking-wider">Creativity (Temperature)</span>
                <span id="temp-val-display" class="font-bold text-ios-blue font-mono">0.7</span>
              </div>
              <input type="range" id="bot-temp-slider" min="0.0" max="2.0" step="0.1" value="0.7" class="w-full accent-ios-blue cursor-pointer" />
            </div>
          </div>

          <!-- Delete Bot Button -->
          <div id="delete-bot-action-container" class="hidden pt-2">
            <button type="button" id="btn-delete-bot" class="w-full py-3 rounded-2xl text-ios-red font-bold bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-900/60 active:opacity-70 text-sm cursor-pointer">
              Delete Character
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- ==================== MODAL: SETTINGS ==================== -->
    <div id="modal-settings" class="hidden fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/60 backdrop-blur-sm">
      <div class="w-full max-w-lg bg-ios-lightBg dark:bg-neutral-900 rounded-t-3xl sm:rounded-3xl max-h-[90vh] flex flex-col overflow-hidden shadow-2xl border border-neutral-200/50 dark:border-neutral-800">
        
        <div class="px-4 py-3.5 border-b border-ios-lightBorder dark:border-ios-darkBorder flex items-center justify-between bg-white dark:bg-neutral-900">
          <h3 class="text-base font-bold">Settings</h3>
          <button type="button" id="btn-close-settings" class="text-sm font-bold text-ios-blue cursor-pointer py-1 px-2">Done</button>
        </div>

        <div class="flex-1 overflow-y-auto p-4 space-y-4 text-sm">
          <!-- API Key Section -->
          <div class="bg-white dark:bg-neutral-800 rounded-2xl p-3.5 border border-neutral-200 dark:border-neutral-700 space-y-2">
            <div class="flex items-center justify-between">
              <label class="text-[11px] font-bold text-ios-gray uppercase tracking-wider">OpenAI API Key</label>
              <span class="text-[10px] text-ios-green font-semibold">Saved Locally</span>
            </div>
            <div class="relative">
              <input type="password" id="input-api-key" placeholder="sk-..." class="w-full bg-neutral-100 dark:bg-neutral-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ios-blue font-mono pr-10" />
              <button type="button" id="btn-toggle-key-visibility" class="absolute right-3 top-2.5 text-ios-gray text-xs cursor-pointer">👁️</button>
            </div>
            <p class="text-[11px] text-ios-gray leading-relaxed">
              Your key stays safely on your iPhone in local storage.
            </p>
          </div>

          <!-- Reset Storage -->
          <div class="pt-2">
            <button type="button" id="btn-reset-all-data" class="w-full py-3 text-xs font-bold text-ios-red bg-red-100/60 dark:bg-red-950/40 rounded-2xl border border-red-200 dark:border-red-900 cursor-pointer">
              Factory Reset (Clear All Data)
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- ==================== TOAST ALERT ==================== -->
    <div id="toast" class="pointer-events-none fixed top-4 inset-x-0 mx-auto max-w-xs z-50 transform -translate-y-16 opacity-0 transition-all duration-300 flex items-center justify-center">
      <div class="bg-neutral-900/90 dark:bg-white/95 text-white dark:text-neutral-900 text-xs font-bold px-4 py-2.5 rounded-full shadow-2xl backdrop-blur-md">
        <span id="toast-message">Notification</span>
      </div>
    </div>

  </div>

  <!-- ==================== SCRIPT LOGIC ==================== -->
  <script>
    const STORAGE_KEY_BOTS = 'aistudio_bots_v2';
    const STORAGE_KEY_CHATS = 'aistudio_chats_v2';
    const STORAGE_KEY_SETTINGS = 'aistudio_settings_v2';

    // Preset Characters
    const DEFAULT_BOTS = [
      {
        id: 'bot-socrates',
        name: 'Socrates',
        tagline: 'Father of Classical Philosophy',
        avatar: '🏛️',
        systemPrompt: 'You are Socrates of Athens. Ask insightful, thought-provoking Socratic questions to lead the user toward wisdom, clarity, and virtue.',
        model: 'gpt-4o-mini',
        temperature: 0.7,
        createdAt: Date.now() - 300000
      },
      {
        id: 'bot-aria-cyberpunk',
        name: 'Aria Kane',
        tagline: 'Cyberpunk Rogue & Netrunner',
        avatar: '⚡',
        systemPrompt: 'You are Aria Kane, a street-smart cyberpunk netrunner in Neo-Tokyo (2089). Speak with tech slang, sharp wit, and vivid futuristic details.',
        model: 'gpt-4o-mini',
        temperature: 0.9,
        createdAt: Date.now() - 200000
      },
      {
        id: 'bot-chef-remy',
        name: 'Chef Alexandre',
        tagline: 'Michelin Star Gourmet Mentor',
        avatar: '👨‍🍳',
        systemPrompt: 'You are Chef Alexandre, an enthusiastic Parisian master chef. Offer creative culinary guidance, techniques, and meal ideas.',
        model: 'gpt-4o-mini',
        temperature: 0.6,
        createdAt: Date.now() - 100000
      }
    ];

    let state = {
      bots: [],
      chats: {},
      activeBotId: null,
      settings: {
        apiKey: '',
        theme: 'dark' // Defaulting to sleek dark mode
      },
      isStreaming: false,
      editingBotId: null,
      tempAvatarBase64: null
    };

    function initApp() {
      loadState();
      applyTheme();
      setupPWA();
      setupEventListeners();
      renderBotList();
    }

    function loadState() {
      try {
        const savedSettings = localStorage.getItem(STORAGE_KEY_SETTINGS);
        if (savedSettings) state.settings = { ...state.settings, ...JSON.parse(savedSettings) };

        const savedBots = localStorage.getItem(STORAGE_KEY_BOTS);
        state.bots = savedBots ? JSON.parse(savedBots) : DEFAULT_BOTS;

        const savedChats = localStorage.getItem(STORAGE_KEY_CHATS);
        state.chats = savedChats ? JSON.parse(savedChats) : {};

        // Add initial greetings for default bots
        if (state.bots.length > 0 && Object.keys(state.chats).length === 0) {
          state.chats['bot-socrates'] = [
            { id: 'init-1', role: 'assistant', content: 'Greetings! What philosophical question shall we examine together today?', timestamp: Date.now() }
          ];
          saveChats();
        }
      } catch (err) {
        console.error('Storage load error', err);
      }
    }

    function saveBots() { localStorage.setItem(STORAGE_KEY_BOTS, JSON.stringify(state.bots)); }
    function saveChats() { localStorage.setItem(STORAGE_KEY_CHATS, JSON.stringify(state.chats)); }
    function saveSettings() { localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify(state.settings)); }

    /* ==================== THEME SYSTEM ==================== */
    function applyTheme() {
      const html = document.documentElement;
      const metaTheme = document.getElementById('meta-theme-color');
      const sunIcon = document.getElementById('theme-icon-sun');
      const moonIcon = document.getElementById('theme-icon-moon');

      if (state.settings.theme === 'dark') {
        html.classList.add('dark');
        if (metaTheme) metaTheme.setAttribute('content', '#000000');
        if (sunIcon) sunIcon.classList.remove('hidden');
        if (moonIcon) moonIcon.classList.add('hidden');
      } else {
        html.classList.remove('dark');
        if (metaTheme) metaTheme.setAttribute('content', '#F2F2F7');
        if (sunIcon) sunIcon.classList.add('hidden');
        if (moonIcon) moonIcon.classList.remove('hidden');
      }
    }

    function toggleTheme() {
      state.settings.theme = state.settings.theme === 'dark' ? 'light' : 'dark';
      saveSettings();
      applyTheme();
      showToast(state.settings.theme === 'dark' ? 'Dark mode enabled' : 'Light mode enabled');
    }

    function setupPWA() {
      const manifest = {
        name: 'AI Personas Studio',
        short_name: 'Personas',
        start_url: './',
        display: 'standalone',
        background_color: '#000000',
        theme_color: '#007AFF',
        icons: [{
          src: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="%23007AFF"/><text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" font-size="52">🤖</text></svg>',
          sizes: '192x192 512x512',
          type: 'image/svg+xml'
        }]
      };
      const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
      document.getElementById('manifest-placeholder').setAttribute('href', URL.createObjectURL(blob));
    }

    /* ==================== NAVIGATION ==================== */
    function switchView(viewName) {
      const viewBots = document.getElementById('view-bots');
      const viewChat = document.getElementById('view-chat');

      if (viewName === 'chat') {
        viewBots.classList.add('hidden');
        viewChat.classList.remove('hidden');
        renderActiveChat();
      } else {
        viewChat.classList.add('hidden');
        viewBots.classList.remove('hidden');
        state.activeBotId = null;
        renderBotList();
      }
    }

    /* ==================== BOT LIST ==================== */
    function renderBotList(filterText = '') {
      const container = document.getElementById('bot-list-container');
      const search = filterText.toLowerCase().trim();

      const filteredBots = state.bots.filter(b => 
        b.name.toLowerCase().includes(search) || 
        (b.tagline && b.tagline.toLowerCase().includes(search))
      );

      if (filteredBots.length === 0) {
        container.innerHTML = `
          <div class="flex flex-col items-center justify-center py-16 text-center text-ios-gray">
            <span class="text-4xl mb-2">🎭</span>
            <p class="font-bold text-sm">No characters found</p>
            <p class="text-xs mt-1">Tap "+ New" above to create one.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filteredBots.map(bot => {
        const history = state.chats[bot.id] || [];
        const lastMsg = history.length > 0 ? history[history.length - 1].content : (bot.tagline || 'Tap to start chatting');
        const isPhoto = bot.avatar && bot.avatar.startsWith('data:image');

        const avatarHTML = isPhoto
          ? `<img src="${bot.avatar}" alt="${escapeHtml(bot.name)}" class="w-full h-full object-cover rounded-full" />`
          : `<span>${bot.avatar || '🤖'}</span>`;

        return `
          <div class="bot-card group flex items-center gap-3.5 p-3.5 rounded-2xl bg-white dark:bg-ios-darkCard border border-neutral-200/80 dark:border-ios-darkBorder shadow-sm active:scale-[0.98] transition-all cursor-pointer" data-id="${bot.id}">
            <div class="w-12 h-12 rounded-full flex-shrink-0 bg-neutral-100 dark:bg-neutral-800 flex items-center justify-center text-xl shadow-inner overflow-hidden border border-neutral-200 dark:border-neutral-700">
              ${avatarHTML}
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center justify-between">
                <h3 class="text-sm font-bold truncate">${escapeHtml(bot.name)}</h3>
                <span class="text-[10px] text-ios-gray font-mono">${bot.model || 'gpt-4o-mini'}</span>
              </div>
              <p class="text-xs text-ios-gray truncate mt-0.5">${escapeHtml(lastMsg)}</p>
            </div>
            <svg class="w-4 h-4 text-neutral-400 dark:text-neutral-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/>
            </svg>
          </div>
        `;
      }).join('');

      container.querySelectorAll('.bot-card').forEach(card => {
        card.addEventListener('click', () => {
          const botId = card.getAttribute('data-id');
          openBotChat(botId);
        });
      });
    }

    function openBotChat(botId) {
      state.activeBotId = botId;
      if (!state.chats[botId]) state.chats[botId] = [];
      switchView('chat');
    }

    /* ==================== CHAT VIEW ==================== */
    function renderActiveChat() {
      const bot = state.bots.find(b => b.id === state.activeBotId);
      if (!bot) return switchView('list');

      document.getElementById('chat-header-name').textContent = bot.name;
      document.getElementById('chat-header-model').textContent = `${bot.model || 'gpt-4o-mini'} • Temp ${bot.temperature ?? 0.7}`;

      const avatarContainer = document.getElementById('chat-header-avatar');
      if (bot.avatar && bot.avatar.startsWith('data:image')) {
        avatarContainer.innerHTML = `<img src="${bot.avatar}" class="w-full h-full object-cover" />`;
      } else {
        avatarContainer.innerHTML = bot.avatar || '🤖';
      }

      const container = document.getElementById('chat-messages-container');
      const messages = state.chats[bot.id] || [];

      if (messages.length === 0) {
        container.innerHTML = `
          <div class="flex flex-col items-center justify-center py-12 text-center text-ios-gray px-6">
            <div class="w-16 h-16 rounded-full bg-neutral-100 dark:bg-neutral-800 flex items-center justify-center text-3xl mb-3">
              ${bot.avatar && bot.avatar.startsWith('data:image') ? `<img src="${bot.avatar}" class="w-full h-full rounded-full object-cover" />` : (bot.avatar || '🤖')}
            </div>
            <h4 class="font-bold text-neutral-800 dark:text-neutral-200 text-sm">${escapeHtml(bot.name)}</h4>
            <p class="text-xs text-ios-gray mt-1">${escapeHtml(bot.tagline || 'Ready to chat.')}</p>
          </div>
        `;
      } else {
        container.innerHTML = messages.map(msg => renderMessageHTML(msg, bot)).join('');
      }

      scrollToBottom();
      validateChatInput();
    }

    function renderMessageHTML(msg, bot) {
      const isUser = msg.role === 'user';
      const time = new Date(msg.timestamp || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      if (isUser) {
        return `
          <div class="flex flex-col items-end">
            <div class="max-w-[85%] px-4 py-2.5 rounded-2xl rounded-br-sm bg-ios-blue text-white shadow-sm break-words text-sm leading-relaxed">
              ${escapeHtml(msg.content).replace(/\n/g, '<br/>')}
            </div>
            <span class="text-[10px] text-ios-gray mt-1 mr-1">${time}</span>
          </div>
        `;
      } else {
        return `
          <div class="flex items-start gap-2.5 max-w-[90%]" id="msg-${msg.id}">
            <div class="w-7 h-7 rounded-full flex-shrink-0 bg-neutral-200 dark:bg-neutral-800 flex items-center justify-center text-xs overflow-hidden mt-0.5">
              ${bot.avatar && bot.avatar.startsWith('data:image') ? `<img src="${bot.avatar}" class="w-full h-full object-cover" />` : (bot.avatar || '🤖')}
            </div>
            <div class="flex flex-col items-start min-w-0">
              <div class="px-4 py-2.5 rounded-2xl rounded-tl-sm bg-ios-lightBubble dark:bg-ios-darkBubble text-neutral-900 dark:text-neutral-100 shadow-sm break-words text-sm leading-relaxed markdown-body">
                ${formatMarkdown(msg.content)}
              </div>
              <span class="text-[10px] text-ios-gray mt-1 ml-1">${time}</span>
            </div>
          </div>
        `;
      }
    }

    async function handleSendMessage(e) {
      if (e) e.preventDefault();
      const textarea = document.getElementById('chat-textarea');
      const text = textarea.value.trim();
      if (!text || state.isStreaming) return;

      const bot = state.bots.find(b => b.id === state.activeBotId);
      if (!bot) return;

      if (!state.settings.apiKey) {
        showToast('Please enter your OpenAI API key in Settings');
        openSettingsModal();
        return;
      }

      const userMessage = {
        id: 'msg-' + Date.now(),
        role: 'user',
        content: text,
        timestamp: Date.now()
      };

      state.chats[bot.id] = state.chats[bot.id] || [];
      state.chats[bot.id].push(userMessage);
      saveChats();

      textarea.value = '';
      textarea.style.height = 'auto';
      validateChatInput();
      renderActiveChat();
      scrollToBottom();

      await streamBotResponse(bot);
    }

    async function streamBotResponse(bot) {
      const container = document.getElementById('chat-messages-container');
      const typingIndicator = document.getElementById('typing-indicator');

      state.isStreaming = true;
      typingIndicator.classList.remove('hidden');
      scrollToBottom();

      const assistantMsgId = 'msg-' + Date.now();
      let assistantContent = '';

      const systemMessage = { role: 'system', content: bot.systemPrompt || `You are ${bot.name}.` };
      const history = (state.chats[bot.id] || []).map(m => ({ role: m.role, content: m.content }));

      try {
        const response = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${state.settings.apiKey.trim()}`
          },
          body: JSON.stringify({
            model: bot.model || 'gpt-4o-mini',
            temperature: parseFloat(bot.temperature ?? 0.7),
            messages: [systemMessage, ...history],
            stream: true
          })
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.error?.message || `HTTP ${response.status}: ${response.statusText}`);
        }

        typingIndicator.classList.add('hidden');

        const newMsgObj = {
          id: assistantMsgId,
          role: 'assistant',
          content: '',
          timestamp: Date.now()
        };
        state.chats[bot.id].push(newMsgObj);

        const wrapper = document.createElement('div');
        wrapper.innerHTML = renderMessageHTML(newMsgObj, bot);
        const msgElement = wrapper.firstElementChild;
        container.appendChild(msgElement);
        const textContainer = msgElement.querySelector('.markdown-body');

        const reader = response.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();

          for (const line of lines) {
            const cleanLine = line.trim();
            if (!cleanLine || cleanLine.startsWith(':')) continue;
            if (cleanLine.startsWith('data: ')) {
              const dataStr = cleanLine.slice(6).trim();
              if (dataStr === '[DONE]') break;
              try {
                const parsed = JSON.parse(dataStr);
                const delta = parsed.choices?.[0]?.delta?.content || '';
                if (delta) {
                  assistantContent += delta;
                  newMsgObj.content = assistantContent;
                  textContainer.innerHTML = formatMarkdown(assistantContent);
                  scrollToBottom();
                }
              } catch (e) {}
            }
          }
        }
        saveChats();

      } catch (error) {
        typingIndicator.classList.add('hidden');
        const errorMsg = {
          id: 'err-' + Date.now(),
          role: 'assistant',
          content: `⚠️ Error: ${error.message}\nCheck your API key in Settings.`,
          timestamp: Date.now()
        };
        state.chats[bot.id].push(errorMsg);
        saveChats();
        renderActiveChat();
        showToast('Connection error');
      } finally {
        state.isStreaming = false;
        scrollToBottom();
      }
    }

    function scrollToBottom() {
      const container = document.getElementById('chat-messages-container');
      if (container) container.scrollTop = container.scrollHeight;
    }

    function validateChatInput() {
      const textarea = document.getElementById('chat-textarea');
      const sendBtn = document.getElementById('btn-send-message');
      sendBtn.disabled = !(textarea.value.trim().length > 0 && !state.isStreaming);
    }

    /* ==================== BOT EDITOR MODAL ==================== */
    function openBotEditor(botIdToEdit = null) {
      state.editingBotId = botIdToEdit;
      state.tempAvatarBase64 = null;

      const modal = document.getElementById('modal-bot-editor');
      const title = document.getElementById('modal-bot-title');
      const deleteBtnContainer = document.getElementById('delete-bot-action-container');

      const nameInput = document.getElementById('bot-name-input');
      const taglineInput = document.getElementById('bot-tagline-input');
      const promptInput = document.getElementById('bot-prompt-input');
      const modelSelect = document.getElementById('bot-model-select');
      const tempSlider = document.getElementById('bot-temp-slider');
      const tempDisplay = document.getElementById('temp-val-display');

      if (botIdToEdit) {
        const bot = state.bots.find(b => b.id === botIdToEdit);
        if (!bot) return;

        title.textContent = 'Edit Character';
        nameInput.value = bot.name || '';
        taglineInput.value = bot.tagline || '';
        promptInput.value = bot.systemPrompt || '';
        modelSelect.value = bot.model || 'gpt-4o-mini';
        tempSlider.value = bot.temperature ?? 0.7;
        tempDisplay.textContent = Number(tempSlider.value).toFixed(1);

        state.tempAvatarBase64 = bot.avatar || '🤖';
        renderAvatarPreview(bot.avatar);
        deleteBtnContainer.classList.remove('hidden');
      } else {
        title.textContent = 'New Character';
        nameInput.value = '';
        taglineInput.value = '';
        promptInput.value = '';
        modelSelect.value = 'gpt-4o-mini';
        tempSlider.value = 0.7;
        tempDisplay.textContent = '0.7';

        state.tempAvatarBase64 = '🤖';
        renderAvatarPreview('🤖');
        deleteBtnContainer.classList.add('hidden');
      }

      modal.classList.remove('hidden');
    }

    function closeBotEditor() {
      document.getElementById('modal-bot-editor').classList.add('hidden');
      state.editingBotId = null;
      state.tempAvatarBase64 = null;
    }

    function renderAvatarPreview(avatar) {
      const container = document.getElementById('bot-avatar-preview');
      if (avatar && avatar.startsWith('data:image')) {
        container.innerHTML = `<img src="${avatar}" class="w-full h-full object-cover" />`;
      } else {
        container.innerHTML = `<span>${avatar || '🤖'}</span>`;
      }
    }

    function saveBotFromEditor() {
      const name = document.getElementById('bot-name-input').value.trim();
      const tagline = document.getElementById('bot-tagline-input').value.trim();
      const systemPrompt = document.getElementById('bot-prompt-input').value.trim();
      const model = document.getElementById('bot-model-select').value;
      const temperature = parseFloat(document.getElementById('bot-temp-slider').value);

      if (!name) {
        showToast('Please provide a name');
        return;
      }

      if (state.editingBotId) {
        const index = state.bots.findIndex(b => b.id === state.editingBotId);
        if (index !== -1) {
          state.bots[index] = {
            ...state.bots[index],
            name,
            tagline,
            systemPrompt,
            model,
            temperature,
            avatar: state.tempAvatarBase64 || state.bots[index].avatar || '🤖'
          };
          showToast('Character updated');
        }
      } else {
        const newBot = {
          id: 'bot-' + Date.now(),
          name,
          tagline,
          systemPrompt,
          model,
          temperature,
          avatar: state.tempAvatarBase64 || '🤖',
          createdAt: Date.now()
        };
        state.bots.unshift(newBot);
        showToast('Character created');
      }

      saveBots();
      closeBotEditor();
      renderBotList();
      if (state.activeBotId) renderActiveChat();
    }

    function deleteCurrentBot() {
      if (!state.editingBotId) return;
      if (!confirm('Are you sure you want to delete this character?')) return;

      const botId = state.editingBotId;
      state.bots = state.bots.filter(b => b.id !== botId);
      delete state.chats[botId];

      saveBots();
      saveChats();
      closeBotEditor();
      switchView('list');
      showToast('Character deleted');
    }

    /* ==================== PHOTO UPLOAD ==================== */
    function processImageUpload(file) {
      if (!file || !file.type.startsWith('image/')) {
        showToast('Please select a photo image');
        return;
      }

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const size = 180;
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          const minDim = Math.min(img.width, img.height);
          const startX = (img.width - minDim) / 2;
          const startY = (img.height - minDim) / 2;

          ctx.drawImage(img, startX, startY, minDim, minDim, 0, 0, size, size);
          const compressed = canvas.toDataURL('image/jpeg', 0.85);
          state.tempAvatarBase64 = compressed;
          renderAvatarPreview(compressed);
          showToast('Photo selected');
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    /* ==================== SETTINGS MODAL ==================== */
    function openSettingsModal() {
      document.getElementById('input-api-key').value = state.settings.apiKey || '';
      document.getElementById('modal-settings').classList.remove('hidden');
    }

    function closeSettingsModal() {
      state.settings.apiKey = document.getElementById('input-api-key').value.trim();
      saveSettings();
      document.getElementById('modal-settings').classList.add('hidden');
      showToast('Settings saved');
    }

    /* ==================== UTILS & FORMATTING ==================== */
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatMarkdown(text) {
      if (!text) return '';
      let escaped = escapeHtml(text);
      escaped = escaped.replace(/```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g, (match, lang, code) => {
        return `<pre class="my-2 p-3 bg-neutral-900 text-neutral-100 rounded-xl text-xs font-mono overflow-x-auto border border-neutral-700"><code>${code.trim()}</code></pre>`;
      });
      escaped = escaped.replace(/`([^`]+)`/g, '<code class="bg-neutral-200 dark:bg-neutral-800 text-ios-blue px-1.5 py-0.5 rounded text-xs font-mono">$1</code>');
      escaped = escaped.replace(/\*\*([^*]+)\*\*/g, '<strong class="font-bold">$1</strong>');
      escaped = escaped.replace(/\*([^*]+)\*/g, '<em class="italic">$1</em>');
      return escaped.replace(/\n/g, '<br/>');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-message').textContent = msg;
      toast.classList.remove('-translate-y-16', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        toast.classList.add('-translate-y-16', 'opacity-0');
        toast.classList.remove('translate-y-0', 'opacity-100');
      }, 2300);
    }

    /* ==================== EVENT LISTENERS ==================== */
    function setupEventListeners() {
      // Direct Top Action Button Clicks
      document.getElementById('btn-toggle-theme').addEventListener('click', toggleTheme);
      document.getElementById('btn-open-settings').addEventListener('click', openSettingsModal);
      document.getElementById('btn-close-settings').addEventListener('click', closeSettingsModal);
      document.getElementById('btn-create-bot').addEventListener('click', () => openBotEditor());
      document.getElementById('btn-chat-back').addEventListener('click', () => switchView('list'));

      // Search Filter
      document.getElementById('input-search-bots').addEventListener('input', (e) => {
        renderBotList(e.target.value);
      });

      // Chat Textarea & Submit
      const textarea = document.getElementById('chat-textarea');
      document.getElementById('chat-form').addEventListener('submit', handleSendMessage);
      textarea.addEventListener('input', () => {
        textarea.style.height = 'auto';
        textarea.style.height = Math.min(textarea.scrollHeight, 128) + 'px';
        validateChatInput();
      });
      textarea.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleSendMessage();
        }
      });

      // Temperature Slider
      const tempSlider = document.getElementById('bot-temp-slider');
      tempSlider.addEventListener('input', (e) => {
        document.getElementById('temp-val-display').textContent = Number(e.target.value).toFixed(1);
      });

      // Bot Editor Modal buttons
      document.getElementById('btn-cancel-bot-edit').addEventListener('click', closeBotEditor);
      document.getElementById('btn-save-bot').addEventListener('click', saveBotFromEditor);
      document.getElementById('btn-delete-bot').addEventListener('click', deleteCurrentBot);

      // Photo upload triggers
      const fileInput = document.getElementById('bot-avatar-file-input');
      const pickPhoto = () => fileInput.click();
      document.getElementById('avatar-picker-trigger').addEventListener('click', pickPhoto);
      document.getElementById('btn-choose-photo').addEventListener('click', pickPhoto);
      fileInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) processImageUpload(e.target.files[0]);
      });

      // Archetype Preset Clicks
      document.querySelectorAll('.btn-quick-archetype').forEach(btn => {
        btn.addEventListener('click', () => {
          document.getElementById('bot-name-input').value = btn.dataset.name;
          document.getElementById('bot-tagline-input').value = btn.dataset.tagline;
          document.getElementById('bot-prompt-input').value = btn.dataset.prompt;
          document.getElementById('bot-temp-slider').value = btn.dataset.temp;
          document.getElementById('temp-val-display').textContent = Number(btn.dataset.temp).toFixed(1);
        });
      });

      // Chat Dropdown Actions
      const menuBtn = document.getElementById('btn-chat-options');
      const dropdown = document.getElementById('chat-dropdown-menu');
      menuBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        dropdown.classList.toggle('hidden');
      });
      document.addEventListener('click', () => dropdown.classList.add('hidden'));

      document.getElementById('menu-edit-bot').addEventListener('click', () => {
        dropdown.classList.add('hidden');
        openBotEditor(state.activeBotId);
      });
      document.getElementById('btn-chat-header-info').addEventListener('click', () => {
        openBotEditor(state.activeBotId);
      });
      document.getElementById('menu-clear-chat').addEventListener('click', () => {
        dropdown.classList.add('hidden');
        if (state.activeBotId && confirm('Clear conversation history?')) {
          state.chats[state.activeBotId] = [];
          saveChats();
          renderActiveChat();
          showToast('History cleared');
        }
      });

      // Key toggle & Data reset
      document.getElementById('btn-toggle-key-visibility').addEventListener('click', () => {
        const input = document.getElementById('input-api-key');
        input.type = input.type === 'password' ? 'text' : 'password';
      });

      document.getElementById('btn-reset-all-data').addEventListener('click', () => {
        if (confirm('Are you sure? This will delete all custom personas and messages.')) {
          localStorage.removeItem(STORAGE_KEY_BOTS);
          localStorage.removeItem(STORAGE_KEY_CHATS);
          localStorage.removeItem(STORAGE_KEY_SETTINGS);
          location.reload();
        }
      });
    }

    document.addEventListener('DOMContentLoaded', initApp);
  </script>
